[metadata]
authors = [
    { name = "Florian Le Guillou", email = "florian.leguillou@datlas.fr" },
    { name = "Valentin Bellemin-Laponnaz", email = "valentin.bellemin@hotmail.fr" },
    { name = "Sammy Metref", email = "sammy.metref@datlas.fr" },
    { name = "Clément Ubelmann", email = "clement.ubelmann@datlas.fr" },
    { name = "Antoine Delepoulle", email = "antoine.delepoulle@datlas.fr" },
    { name = "Emmanuel Cosme", email = "Emmanuel.Cosme@univ-grenoble-alpes.fr" },
]classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: POSIX
    Topic :: Scientific/Engineering :: Physics
description = Variational reconstruction of ocean dynamical variables
long_description = file: README.md
long_description_content_type = text/x-md
name = vardyn_core
license = "CC0-1.0"
copyright = "CC0 1.0 Universal (CC0 1.0) Public Domain Dedication"

[options]
install_requires =
    numpy
    jax
    xarray
    scipy
    netCDF4
package_dir =
    = .
packages = find:
python_requires = >=3.10
zip_safe = False

[options.extras_require]
test =
    pytest


[flake8]
exclude = docs,tests
max-line-length = 140
ignore =
    # Ambiguous variable names
    E741
    # line break before binary operator
    W503
    # line break after binary operator
    W504
    # whitespace before :
    E203

[isort]
combine_as_imports=True
force_grid_wrap=0
force_sort_within_sections=True
force_to_top=typing
include_trailing_comma=True
line_length=140
multi_line_output=3
skip=
    build
    docs/source/conf.py
